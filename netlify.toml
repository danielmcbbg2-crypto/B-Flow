# Netlify picks these up automatically when you connect the GitHub repository.
# Also set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers, applied to every response. The Content-Security-Policy allows only the origins
# this app actually uses: Supabase (API, realtime websocket, storage, functions), Google Fonts and
# — when VITE_GA_MEASUREMENT_ID is set — Google Analytics. Scripts are 'self' only (no inline), which
# is why the Vite module-preload polyfill is turned off in vite.config.ts. If you add a new third
# party (a chat widget, a map, a payment page), add its origin to the matching directive below.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
